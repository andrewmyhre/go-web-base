_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# Square-bracket delimiters: the template's Svelte uses {#if}, which the
# default Jinja delimiters read as a comment, and Go format strings use [%q].
_envops:
  block_start_string: "[[%"
  block_end_string: "%]]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[[#"
  comment_end_string: "#]]"
  keep_trailing_newline: true

_message_after_copy: |
  Generated [[ project_slug ]]. Nothing works on the cluster until the
  per-project setup checklist in the go-web-base README is done.

project_slug:
  type: str
  help: Project slug (binary, image, Deployment and namespace names)
  validator: >-
    [[% if not (project_slug | regex_search('^[a-z][a-z0-9-]{0,40}[a-z0-9]$')) %]]
    Lowercase letters, digits and hyphens; starts with a letter, 2-42 characters.
    [[% endif %]]

project_name:
  type: str
  help: Display name (UI title, PWA manifest, prose)
  default: "[[ project_slug | replace('-', ' ') | title ]]"

github_repo:
  type: str
  help: GitHub repository, owner/name
  default: "andrewmyhre/[[ project_slug ]]"

go_module:
  type: str
  help: Go module path
  default: "github.com/[[ github_repo ]]"
  validator: >-
    [[% if not (go_module | regex_search('^[a-z0-9][a-z0-9._/-]*[a-z0-9]$')) %]]
    Not a plausible Go module path.
    [[% endif %]]

env_prefix:
  type: str
  help: Environment variable prefix (PREFIX_ADDR, PREFIX_DATABASE_DSN, ...). Its lower case names cookies, the Postgres user and Redis keys.
  default: "[[ project_slug | upper | replace('-', '_') ]]"
  validator: >-
    [[% if not (env_prefix | regex_search('^[A-Z][A-Z0-9_]*[A-Z0-9]$')) %]]
    Upper case letters, digits and underscores; starts with a letter.
    [[% endif %]]

dev_host:
  type: str
  help: Hostname of the dev environment
  default: "[[ project_slug ]]-dev.immutablesoftware.dev"

dev_namespace:
  type: str
  help: Kubernetes namespace for dev
  default: "[[ project_slug ]]-dev"

test_namespace:
  type: str
  help: Kubernetes namespace for the throwaway test Postgres and Redis
  default: "[[ project_slug ]]-test"

registry:
  type: str
  help: Image registry (plain HTTP, pushed to by BuildKit)
  default: "192.168.0.10:30500"

# NodePorts already taken on the homelab cluster (kubectl get svc -A,
# 2026-11-10). Only services NOT generated from this template belong here:
# adding a generated project's own ports would make its `copier update` fail
# validation.
taken_nodeports:
  type: yaml
  when: false
  default: [30017, 30050, 30080, 30096, 30100, 30174, 30432, 30443, 30491, 30500, 30533, 30543, 30554, 30580, 30637, 30732, 30778, 30880, 30999, 31666, 32554]

# No defaults: two projects on one cluster cannot share these, so a default
# would collide for the second project that kept it.
test_postgres_nodeport:
  type: int
  help: NodePort for the test Postgres, 30000-32767 and free on the cluster (check with `kubectl get svc -A`)
  validator: >-
    [[% if not (30000 <= test_postgres_nodeport <= 32767) %]]Must be 30000-32767.
    [[%- elif test_postgres_nodeport in taken_nodeports %]]Already taken on the cluster; pick a free port.
    [[%- endif %]]

test_redis_nodeport:
  type: int
  help: NodePort for the test Redis, 30000-32767, free on the cluster and not the Postgres port
  validator: >-
    [[% if not (30000 <= test_redis_nodeport <= 32767) %]]Must be 30000-32767.
    [[%- elif test_redis_nodeport in taken_nodeports %]]Already taken on the cluster; pick a free port.
    [[%- elif test_redis_nodeport == test_postgres_nodeport %]]Must differ from the Postgres port.
    [[%- endif %]]

admin_sub:
  type: str
  help: Google OIDC sub of the global Admin (leave empty and set it after the first sign-in)
  default: ""
  validator: "[[% if admin_sub and not (admin_sub | regex_search('^[0-9]+$')) %]]A Google sub is digits only, never an email.[[% endif %]]"

# Derived values: never asked, never stored, recomputed on every update.
ident:
  type: str
  when: false
  default: "[[ env_prefix | lower ]]"

dev_subdomain:
  type: str
  when: false
  default: "[[ dev_host.split('.')[0] ]]"
