# Template CI: render a sample project from this commit with fixed answers,
# then run the generated project's own checks in it, so the template cannot
# rot. Woodpecker reads only this root file, never template/.woodpecker.yml.jinja,
# so the sample's image build and deploy steps never run here.
#
# Every optional feature is a boolean Copier question, so the template is
# rendered twice: sample/ with every feature off (the defaults) and
# sample-features/ with every feature on. Both get the same sweeps and the same
# Go and UI checks, so neither side of a toggle can rot.
#
# A generated project imports core instead of carrying a copy, and needs no
# Postgres or Redis for its own tests. Its go.mod requires a core release that
# may not exist yet, so the go steps point it at ../core, the core in the same
# commit (and, with a feature on, at ../features/<name>), before they build
# anything.
#
# The generated UI imports @andrewmyhre/web-base-ui, whose release URL may not
# exist yet, so the ui step builds and packs packages/web-base-ui from this
# commit and points the sample at that tarball before it checks anything.
#
# The core step tests the core/ Go module and the features/example module,
# plain modules that are not rendered (the feature builds against ../../core
# through its go.mod replace). Unlike the sample it runs their Postgres and
# Redis tests for real,
# against the services: below, which Woodpecker starts for the workflow and
# makes reachable by service name. Nothing there sets CORE_SKIP_SERVICE_TESTS,
# so a missing service fails the step rather than skipping tests.
#
# Woodpecker substitutes dollar references at load time, so shell variables
# are written with a doubled dollar sign.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

steps:
  # --vcs-ref HEAD renders this commit; without it Copier renders the latest
  # tag. The control render uses huddle answers and must bring the string back,
  # which proves the sweep can see a hit.
  - name: render
    image: ghcr.io/astral-sh/uv:0.9.8-python3.12-bookworm
    commands:
      - |
        set -eu
        git config --global --add safe.directory '*'
        COPIER="uvx copier@9.19.1"
        $${COPIER} copy --vcs-ref HEAD --defaults --trust . sample \
          -d project_slug=sample-app -d github_repo=example/sample-app
        $${COPIER} copy --vcs-ref HEAD --defaults --trust . sample-features \
          -d project_slug=sample-app -d github_repo=example/sample-app \
          -d feature_example=true
        $${COPIER} copy --vcs-ref HEAD --defaults --trust . /tmp/control \
          -d project_slug=huddle-go -d project_name=Huddle -d go_module=huddle-go -d env_prefix=HUDDLE
        test "$(grep -rIil huddle /tmp/control | wc -l)" -gt 0
        for d in sample sample-features; do
          if grep -rIil huddle $${d}; then
            echo "sweep: huddle survives in $${d}" >&2
            exit 1
          fi
          if grep -rnI --exclude=pnpm-lock.yaml -e '\[\[' -e '\]\]' $${d}; then
            echo "sweep: an unrendered [[ ]] tag survives in $${d}" >&2
            exit 1
          fi
        done
        # With every feature off, nothing of a feature may appear in the Go,
        # deploy manifests or docs of the sample.
        if grep -rnI --exclude=pnpm-lock.yaml -e 'features/example' -e 'EXAMPLE_GREETING' -e 'example\.New' -e '/example/hello' -e 'ExampleGreetings' sample; then
          echo "sweep: example feature glue survives with feature_example=false" >&2
          exit 1
        fi
        # And with it on, the glue must be there.
        grep -q 'example.New("Contributor")' sample-features/cmd/sample-app/main.go
        grep -q '/example/hello' sample-features/ui/openapi.json
        # Untouched copies for release-check: the go steps below edit the samples.
        cp -r sample release-sample
        cp -r sample-features release-sample-features

  - name: go
    image: golang:1.26
    depends_on: [render]
    commands:
      - cd sample
      - go mod edit -replace github.com/andrewmyhre/go-web-base/core=../core
      - go mod tidy
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  - name: go-features
    image: golang:1.26
    depends_on: [render]
    commands:
      - cd sample-features
      - go mod edit -replace github.com/andrewmyhre/go-web-base/core=../core
      - go mod edit -replace github.com/andrewmyhre/go-web-base/features/example=../features/example
      - go mod tidy
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  # On a template tag, prove the tagged template works for a real consumer:
  # the sample builds and tests against the published core it pins, with no
  # replace and a read-only go.sum, so a missing or wrong go.sum line fails.
  - name: release-check
    image: golang:1.26
    depends_on: [render]
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
    commands:
      - for d in release-sample release-sample-features; do (cd $${d} && go build ./... && go vet ./... && go test ./...); done

  - name: core
    image: golang:1.26
    environment:
      CORE_TEST_DATABASE_URL: postgres://postgres:ci@core-pg-${CI_PIPELINE_NUMBER}:5432/core_test?sslmode=disable
      CORE_TEST_REDIS_ADDR: core-redis-${CI_PIPELINE_NUMBER}:6379
    commands:
      # The postgres image listens on TCP only once its init is done, so an
      # open port means it is ready. Give up after two minutes.
      - timeout 120 bash -c 'until (echo > /dev/tcp/core-pg-${CI_PIPELINE_NUMBER}/5432) 2>/dev/null; do sleep 2; done'
      - timeout 60 bash -c 'until (echo > /dev/tcp/core-redis-${CI_PIPELINE_NUMBER}/6379) 2>/dev/null; do sleep 1; done'
      - cd core
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...
      - cd ../features/example
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  # The UI package is tested and packed from this commit, then the sample
  # depends on that local tarball instead of the pinned release URL, the way
  # the go step points the sample at ../core. The sample's lockfile is
  # rewritten by the add, so this step cannot use --frozen-lockfile; the
  # frozen check on the pinned URL is release-check-ui.
  - name: ui-package
    image: node:22.23.4-bookworm
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - cd packages/web-base-ui
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm test
      - pnpm check
      # Version 0.0.0 as committed, so the tarball is andrewmyhre-web-base-ui-0.0.0.tgz.
      - pnpm pack --pack-destination ../..
      - test -f ../../andrewmyhre-web-base-ui-0.0.0.tgz

  - name: ui
    image: node:22.23.4-bookworm
    depends_on: [render, ui-package]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - cd sample/ui
      - corepack enable
      - pnpm pkg set "dependencies.@andrewmyhre/web-base-ui=file:../../andrewmyhre-web-base-ui-0.0.0.tgz"
      - pnpm install --no-frozen-lockfile
      - pnpm run check:client
      - pnpm test
      - pnpm check
      - pnpm build

  # On a template tag, the same UI checks against the pinned release URL
  # with a frozen lockfile, so a stale pnpm-lock.yaml or a missing release
  # asset fails here. scripts/release.sh creates the release and the lockfile.
  - name: release-check-ui
    image: node:22.23.4-bookworm
    depends_on: [render]
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - |
        set -eu
        corepack enable
        for d in release-sample release-sample-features; do
          (cd $${d}/ui && pnpm install --frozen-lockfile && pnpm run check:client && pnpm test && pnpm check && pnpm build)
        done

  - name: ui-features
    image: node:22.23.4-bookworm
    depends_on: [render, ui-package]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - cd sample-features/ui
      - corepack enable
      - pnpm pkg set "dependencies.@andrewmyhre/web-base-ui=file:../../andrewmyhre-web-base-ui-0.0.0.tgz"
      - pnpm install --no-frozen-lockfile
      - pnpm run check:client
      - pnpm test
      - pnpm check
      - pnpm build

# Named per pipeline. On the Kubernetes backend a service runs as a pod with a
# unique name, and steps reach it by its step name through a headless Service
# in the shared woodpecker namespace, so per-pipeline names keep concurrent
# pipelines from resolving each other's databases. Some pipelines here have
# hung after their steps finished (10, 13, 19); the cause is not known, and
# these names did not prevent it. ${CI_PIPELINE_NUMBER} is substituted when
# Woodpecker loads this file.
services:
  - name: core-pg-${CI_PIPELINE_NUMBER}
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: core_test
  - name: core-redis-${CI_PIPELINE_NUMBER}
    image: redis:8.10-alpine
