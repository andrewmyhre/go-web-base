# Template CI: render a sample project from this commit with fixed answers,
# then run the generated project's own checks in it, so the template cannot
# rot. Woodpecker reads only this root file, never template/.woodpecker.yml.jinja,
# so the sample's image build and deploy steps never run here.
#
# A generated project imports core instead of carrying a copy, and needs no
# Postgres or Redis for its own tests. Its go.mod requires a core release that
# may not exist yet, so the go step points it at ../core, the core in the same
# commit, before it builds anything.
#
# The core step tests the core/ Go module and the features/example module,
# plain modules that are not rendered (the feature builds against ../../core
# through its go.mod replace). Unlike the sample it runs their Postgres and
# Redis tests for real,
# against the services: below, which Woodpecker starts for the workflow and
# makes reachable by service name. Nothing there sets CORE_SKIP_SERVICE_TESTS,
# so a missing service fails the step rather than skipping tests.
#
# Woodpecker substitutes dollar references at load time, so shell variables
# are written with a doubled dollar sign.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

steps:
  # --vcs-ref HEAD renders this commit; without it Copier renders the latest
  # tag. The control render uses huddle answers and must bring the string back,
  # which proves the sweep can see a hit.
  - name: render
    image: ghcr.io/astral-sh/uv:0.9.8-python3.12-bookworm
    commands:
      - |
        set -eu
        git config --global --add safe.directory '*'
        COPIER="uvx copier@9.19.1"
        $${COPIER} copy --vcs-ref HEAD --defaults --trust . sample \
          -d project_slug=sample-app -d github_repo=example/sample-app
        $${COPIER} copy --vcs-ref HEAD --defaults --trust . /tmp/control \
          -d project_slug=huddle-go -d project_name=Huddle -d go_module=huddle-go -d env_prefix=HUDDLE
        if grep -rIil huddle sample; then
          echo "sweep: huddle survives in the sample" >&2
          exit 1
        fi
        test "$(grep -rIil huddle /tmp/control | wc -l)" -gt 0
        if grep -rnI --exclude=pnpm-lock.yaml -e '\[\[' -e '\]\]' sample; then
          echo "sweep: an unrendered [[ ]] tag survives in the sample" >&2
          exit 1
        fi
        # An untouched copy for release-check: the go step below edits sample/.
        cp -r sample release-sample

  - name: go
    image: golang:1.26
    depends_on: [render]
    commands:
      - cd sample
      - go mod edit -replace github.com/andrewmyhre/go-web-base/core=../core
      - go mod tidy
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  # On a template tag, prove the tagged template works for a real consumer:
  # the sample builds and tests against the published core it pins, with no
  # replace and a read-only go.sum, so a missing or wrong go.sum line fails.
  - name: release-check
    image: golang:1.26
    depends_on: [render]
    when:
      - event: tag
        ref: refs/tags/v*
    environment:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
    commands:
      - cd release-sample
      - go build ./...
      - go vet ./...
      - go test ./...

  - name: core
    image: golang:1.26
    environment:
      CORE_TEST_DATABASE_URL: postgres://postgres:ci@core-pg-${CI_PIPELINE_NUMBER}:5432/core_test?sslmode=disable
      CORE_TEST_REDIS_ADDR: core-redis-${CI_PIPELINE_NUMBER}:6379
    commands:
      # The postgres image listens on TCP only once its init is done, so an
      # open port means it is ready. Give up after two minutes.
      - timeout 120 bash -c 'until (echo > /dev/tcp/core-pg-${CI_PIPELINE_NUMBER}/5432) 2>/dev/null; do sleep 2; done'
      - timeout 60 bash -c 'until (echo > /dev/tcp/core-redis-${CI_PIPELINE_NUMBER}/6379) 2>/dev/null; do sleep 1; done'
      - cd core
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...
      - cd ../features/example
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  - name: ui
    image: node:22.23.4-bookworm
    depends_on: [render]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - cd sample/ui
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm run check:client
      - pnpm test
      - pnpm check
      - pnpm build

# Named per pipeline: on the Kubernetes backend each service becomes a
# Kubernetes Service named after it, all in one namespace, so two go-web-base
# pipelines running at once would collide on a fixed name. With fixed names,
# the second of two concurrent pipelines hung (pipelines 10 and 13).
# ${CI_PIPELINE_NUMBER} is substituted when Woodpecker loads this file.
services:
  - name: core-pg-${CI_PIPELINE_NUMBER}
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: core_test
  - name: core-redis-${CI_PIPELINE_NUMBER}
    image: redis:8.10-alpine
