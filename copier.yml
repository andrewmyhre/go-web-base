_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# Square-bracket delimiters: the template's Svelte uses {#if}, which the
# default Jinja delimiters read as a comment, and Go format strings use [%q].
_envops:
  block_start_string: "[[%"
  block_end_string: "%]]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[[#"
  comment_end_string: "#]]"
  keep_trailing_newline: true

_message_after_copy: |
  Generated [[ project_slug ]]. Nothing works on the cluster until the
  per-project setup checklist in the go-web-base README is done.

project_slug:
  type: str
  help: Project slug (binary, image, Deployment and namespace names)
  validator: >-
    [[% if not (project_slug | regex_search('^[a-z][a-z0-9-]{0,40}[a-z0-9]$')) %]]
    Lowercase letters, digits and hyphens; starts with a letter, 2-42 characters.
    [[% endif %]]

project_name:
  type: str
  help: Display name (UI title, PWA manifest, prose)
  default: "[[ project_slug | replace('-', ' ') | title ]]"

github_repo:
  type: str
  help: GitHub repository, owner/name
  default: "andrewmyhre/[[ project_slug ]]"

go_module:
  type: str
  help: Go module path
  default: "github.com/[[ github_repo ]]"
  validator: >-
    [[% if not (go_module | regex_search('^[a-z0-9][a-z0-9._/-]*[a-z0-9]$')) %]]
    Not a plausible Go module path.
    [[% endif %]]

env_prefix:
  type: str
  help: Environment variable prefix (PREFIX_ADDR, PREFIX_DATABASE_DSN, ...). Its lower case names cookies, the Postgres user and Redis keys.
  default: "[[ project_slug | upper | replace('-', '_') ]]"
  validator: >-
    [[% if not (env_prefix | regex_search('^[A-Z][A-Z0-9_]*[A-Z0-9]$')) %]]
    Upper case letters, digits and underscores; starts with a letter.
    [[% endif %]]

dev_host:
  type: str
  help: Hostname of the dev environment
  default: "[[ project_slug ]]-dev.immutablesoftware.dev"

dev_namespace:
  type: str
  help: Kubernetes namespace for dev
  default: "[[ project_slug ]]-dev"

registry:
  type: str
  help: Image registry (plain HTTP, pushed to by BuildKit)
  default: "192.168.0.10:30500"

admin_sub:
  type: str
  help: Google OIDC sub of the global Admin (leave empty and set it after the first sign-in)
  default: ""
  validator: "[[% if admin_sub and not (admin_sub | regex_search('^[0-9]+$')) %]]A Google sub is digits only, never an email.[[% endif %]]"

feature_example:
  type: bool
  help: Install the example feature (GET /example/hello, granted to Contributor)?
  default: false

style:
  type: str
  help: >-
    Visual style of the UI. "Default" is the plain look the template has always
    shipped; the others restyle every component from one stylesheet. People
    using the app cannot switch it. Change it later with
    `copier update -d style=<name>`. See docs/styles.md.
  default: default
  choices:
    "Default (the plain look the template ships)": default
    "Bitmap Desktop - 1980s black-and-white bitmap desktops: dithered backdrop, hard one-pixel shadows and pixel headings": bitmap-desktop
    "Broadsheet - A newspaper front page: high-contrast masthead headings, double column rules, newsprint cream and a book serif": broadsheet
    "Confetti - 1980s Italian postmodern furniture: confetti patterns, chunky outlines, offset shadows and clashing pastels": confetti
    "Cutout - Cut-paper poster graphics: flat vermilion blocks on cream, towering condensed capitals and thick black outlines": cutout
    "Deco Marquee - Art Deco (1925-1935) marquee lettering: stepped corners, thin gold double rules, gilt on black": deco-marquee
    "Departures Board - Airport and rail departure boards: amber on black, tabular mono capitals, one row per item": departures-board
    "Jazz Sleeve - 1960s jazz record sleeves: tall condensed capitals over a heavy ink bar on cream stock with a single blue": jazz-sleeve
    "Journal Article - A scientific journal: condensed sans section heads, serif running text, hairline rules and one reference blue": journal
    "Letterpress - Letterpress job printing: black and red ink on cream stock, double-rule borders and a fat didone display face": letterpress
    "Mid-Century House - Mid-century modern houses: warm timber tones, one saturated accent, low wide geometric headings and a book serif": mid-century-house
    "Noir Newsprint - Mid-century crime thriller posters: newsprint grey, deep black, high-contrast Didone capitals and one lipstick red": noir
    "Paperback - 1930s-60s paperback covers: coloured horizontal bands, a tracked humanist sans and cream stock": paperback
    "Park Sign - National park entrance signs: slab-serif cream letters on timber brown with forest green trail markers": park-sign
    "Pastel Register - Symmetrical pastel title cards: flat pink and plum, a geometric Futura-style face and a serif for reading": pastel-register
    "Phosphor Terminal - A 1970s ship-computer console: green phosphor on black, monospaced capitals, scan lines and bracket-framed cards": phosphor-terminal
    "Photocopy Zine - A 1990s photocopied zine: condensed capitals, hard offset shadows, cut-and-paste borders and a highlighter accent": photocopy-zine
    "Primaries - Early-modernist poster geometry: flat primary colours, hard black bars and a geometric sans in capitals": primaries
    "Printed Bloom - 1960s Scandinavian printed textiles: one fearless colour, a faint dot print, soft serif headings and pebble-shaped cards": printed-bloom
    "Raw Concrete - Brutalist web design and 1990s manual pages: monospace everywhere, heavy black borders, underlined links and one highlighter yellow": raw-concrete
    "Transit Line - Metro wayfinding: bold line colours under headings, pill-shaped route markers and station-sign lettering": transit-line

# Derived values: never asked, never stored, recomputed on every update.
ident:
  type: str
  when: false
  default: "[[ env_prefix | lower ]]"

dev_subdomain:
  type: str
  when: false
  default: "[[ dev_host.split('.')[0] ]]"
